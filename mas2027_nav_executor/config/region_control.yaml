/**:
  ros__parameters:
    # Remote-style yaw command; lower board keeps its existing auto_yaw_offset logic.
    gimbal_follow:
      # Choose the nearer forward/reverse tangent; translation still follows MINCO.
      allow_reverse: true
      reverse_switch_hysteresis_deg: 10.0
      ready_tolerance_deg: 5.0
      ready_release_deg: 8.0
      settle_time_s: 0.3
      # Keep base_link +X/-X on the path axis even while translation is blocked.
      # 提高静止对齐时的航向收敛速度；角速度上限、5/8 度就绪门及稳定时间不变。
      heading_error_gain_s: 2.0
      heading_deadband_deg: 0.5
      max_heading_rate_deg_s: 120.0
      # On a slope, if the planner is between trajectories, keep follow_gimbal=1 at the last
      # integrated angle and send zero translation instead of returning the lower
      # board to free-spin mode. New trajectories continue from the held angle.
      hold_last_alignment: true
    region_control:
      # Special terrain labels equal chassis modes: slope=5, tunnel=6, undulating=7.
      # Ordinary sections stay at 3.0/4.0; slope mode may rise to 4.0/5.0.
      normal_mode: 4
      normal_max_speed: 3.0
      normal_max_acceleration: 4.0
      speed_blend_rate: 2.0
      acceleration_blend_rate: 4.0
      slope:
        # 先到入口轴线正前方并完成路径转向，才开启云台/底盘对齐。
        front_entry:
          enable: true
          lateral_tolerance: 0.15
          # 已进入同一坡道的对齐允许一格定位/语义抖动，避免反复退出、清零再等待。
          lateral_hysteresis: 0.05
          min_alignment_cosine: 0.8
        mode: 5
        max_speed: 4.0
        max_acceleration: 5.0
        # 临近坡脚才退出自转；窗口外仍自转并按原刹车能力提前平滑收速。
        prepare_distance: 0.3
        activation_distance: 0.2
        commit_distance: 0.1
        release_distance: 0.5
      tunnel:
        mode: 6
        max_speed: 3.0
        max_acceleration: 4.0
        prepare_distance: 1.0
        activation_distance: 0.8
        commit_distance: 0.2
        release_distance: 0.5
      undulating:
        mode: 7
        max_speed: 3.0
        max_acceleration: 4.0
        prepare_distance: 1.0
        activation_distance: 0.8
        commit_distance: 0.2
        release_distance: 0.5
        # The field's undulating segment is fixed-length. Once entered, hold
        # mode 7 and path-axis alignment for this distance without re-detecting.
        alignment_latch_enable: true
        alignment_latch_distance: 3.2
        # Opt-in simulation/bench crawl takeover. Keep false on the vehicle:
        # real testing uses the normal planner plus the fixed-length latch.
        crawl_enable: false
        crawl_speed: 0.30
