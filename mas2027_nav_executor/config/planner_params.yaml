# Like HW/nav_executor, every config file uses a wildcard node selector and
# hierarchical parameter names. The embedded planner node receives this too.
/**:
  ros__parameters:
    planner:
      # Static terrain owns global topology; ROGMap supplies online occupancy and distance.
      planner_mode: EXPLORATION
      global_frame: odom
      frames:
        map_frame: map
        rog_frame: odom
      allow_unknown: false
      # 全局主搜索选择：true = SMAC 2D（含 ESDF 势场软代价），false = 退回 Astar（NavFn 波前）。
      # SMAC 失败直接失败、不自动回退 Astar，避免一次失败出现两条搜索与两套日志；本项是
      # configure-time 结构开关（决定 smac_planner_ 是否存在），运行时改会被拒绝。
      use_smac: true
      # 几字坡：先在坡前空地转向，再沿坡轴进入；重启生效。
      directional_terrain:
        enable: true
        min_alignment_cosine: 0.8
        # 路径在坡前 0.5 m 完成转向；这不触发退出自转，对齐窗口独立配置。
        # 搜索、局部种子、平滑后的轨迹验收共用该直线接近区。
        approach_distance: 0.5
        # 平滑约束覆盖完整接近区，避免搜索折线在坡前被优化成切角。
        run_up: 0.5
        transition: 0.1
        saturation_length: 0.05
        alignment_weight: 100.0
        curvature_weight: 100.0
      smac_2d:
        # 代价增量 = step * min(weight * exp(-dist/decay), max_cost)，dist 取自 TerrainMapQuery
        # 烘焙的二维有符号距离场（自由为正，上限 3.0 m），作用是让折线远离墙面、贴近走廊中线。
        # 下列势场与最小净空参数可以在线调（现场标定不必重启）。
        use_esdf_cost: true
        # 增强近墙代价，让 C 型拐道的全局折线更倾向外侧净空；实地图路线离线对比
        # 从 2.0 提至 4.0 后，绕行段最小静态净空约 0.32→0.39 m，长度约增加 0.14 m。
        esdf_weight: 4.0
        esdf_decay: 0.8
        # 势场封顶值 max_cost 应 ≥ esdf_weight，避免近墙代价饱和后失去净空梯度。
        # 5.0 高于当前权重 4.0（封顶不生效），并与
        # smac_planner_2d_simple.hpp 的代码默认值一致；本项只影响全局折线形状与 MINCO 参考线，
        # 不改变任何净空判据。
        esdf_max_cost: 5.0
        # 搜索地图 ESDF 到不可通行格的最低中心净空，直接主搜索和在线子目标回退共用。
        # 调参基线：0.27 比轨迹有效硬阈值 0.26 m 高 1 cm。ESDF 未预膨胀，
        # 此距离从车体中心量起；它不能代表底盘原地旋转所需的空间。
        # 低于此值的格不参与主搜索；此余量不保证平滑后的轨迹安全，仍须逐点校验。
        minimum_clearance: 0.27
        # 主搜索在 0.27 m 下无解时，用这个更低净空再搜索一次；只用于给局部
        # 规划器一条可跟踪的参考线。必须 >= narrow_passage_clearance，且只在
        # narrow_passage_enable=true 时生效；0 表示关闭该回退。
        relaxed_minimum_clearance: 0.25
        # 探索/脱困目标偏好的台阶边缘距离，作为额外软代价。优选远离边缘
        # 的站位点，但不删除窄平台上仍满足原硬净空的全部前沿。
        # 0 表示关闭。
        height_clearance: 0.45
      odom_topic: /Odometry
      # pose/twist已由LIO统一到base_link；规划与MPC直接使用，不再重复补偿雷达偏心。
      tolerance: 0.3
      exploration:
        boundary_margin: 0.2
        boundary_sample_step: 0.1
        # 必须与 planner.rog_map.projection.unknown_as_occupied 保持一致（本项管全局搜索，
        # 那一项管二维 ESDF）；不一致时同一格会被判为不可通行又被判为自由，目标附近反复失败。
        unknown_as_occupied: false
        prefer_goal_direction: true
      corridor:
        # 走廊生成的近似半径；真实旋转外廓单独记录在 swept_radius。
        robot_radius: 0.28
        # 实测正方形车体中心到角点的旋转半径 302 mm；对齐直行半宽约 214 mm。
        # 旋转半径仅用于姿态模式的空间判断，不能作为整条直行轨迹的统一门槛。
        swept_radius: 0.302
        # 本轮按历史撞墙参数逐步标定净空；低于实测旋转外廓时须显式开启，
        # 启动会打印有效门槛与外廓差值。完成标定后恢复为 false。
        allow_undersized_clearance: true
        extra_margin: 0.05
      minco_optimizer:
        lookahead_dist: 10.0
        traj_goal_tolerance: 0.15
        # 目标格被占据或净空不足时，沿 start→goal 反方向最多回退这么多米找
        # 一个可通行的接近点；直线找不到时，再在目标周围同范围内找机器人
        # 一侧的可通行排出点，避免整个目标被最后一格直接否掉。最终轨迹和
        # 执行前指令门仍按原阈值验收；0 表示关闭。
        goal_approach_max_shorten: 1.5
        enable_yaw_opt: true
        max_yaw_dot: 5.0
        # 优化器位置罚项的软目标净空，只影响优化器，不是硬安全门。
        # 比 collision_dist 高 0.05 m，给平滑和 ESDF 抖动留余量。
        safe_dist: 0.33
        # 原局部路径仍可通行但净空偏小时，优选满足 safe_dist 的绕行种子；
        # 找不到则继续使用原路径。关闭仅停用这一优选步骤，安全校验阈值不变。
        clearance_detour_enable: true
        # 唯一硬净空：发布前整条轨迹和执行前当前指令共用。
        # 历史撞墙参数：有效阈值 = collision_dist - ESDF 抖动余量(0.02) = 0.26 m。
        # 低于实测旋转外接圆半径 0.302 m；只可用于已对齐的直行标定。
        collision_dist: 0.28
        # 窄道续行：机器人实测净空已在 [floor, 有效阈值) 内，或已提交轨迹在
        # 前方 1.5 m 内进入该区间时启用；不做全局降阈值。整条指令仍要求
        # >= floor，并由执行器提前限速。若现场出现擦碰应立即关闭。
        narrow_passage_enable: true
        # 历史通过参数 0.24 m，低于 0.302 m 旋转外廓；不能在此净空原地旋转。
        # 轨迹门把任一安全窄点前后 0.50 m 的参考折线视作同一走廊；稠密参考线本身低于地板时，局部
        # 栅格会先按该地板重搜参考线，找不到才保留原路径交给轨迹门。
        narrow_passage_clearance: 0.24
        narrow_passage_speed: 0.5
        # 向障碍物运动时额外要求 v_toward*reaction_time + v_toward²/(2a)；
        # 与上述车体静态净空相加。平行墙面行驶不按纵向速度追加制动距离。
        # deceleration<=0 只关闭动态速度项，车体静态净空仍保持。
        clearance_braking:
          deceleration: 1.2
          reaction_time: 0.20
        # 目标接近减速带（规划种子与 MPC 参考共用）。20261018_194203 实车标定：
        # 底盘实际只能提供约 1.4–2.6 m/s² 的减速度（含响应延迟等效 0.6–1.0），
        # 而原先种子与 MPC 都按 max_acceleration=5.0 编刹车余量，参考线在离目标
        # 0.3 m 处仍有约 1.1 m/s，实测过冲 0.6–1.1 m 并往复震荡（9 目标只到 5 个）。
        # 这里按 v <= sqrt(2*deceleration*(剩余弧长 - stop_margin)) 封顶，下限
        # min_speed 保留爬行；deceleration<=0 关闭该功能。
        goal_approach:
          # 实测刹车能力；含反应时间求解 v·τ + v²/(2a) <= 剩余弧长 - stop_margin。
          deceleration: 1.2
          reaction_time: 0.20
          stop_margin: 0.30
          min_speed: 0.15
        # 航向对齐由地形标签 5/6/7 触发；不根据几何窄处触发。
        # 窄道续行限速、净空门和制动门仍使用上面的配置。
        # 失败原因日志策略（仅排障，不影响规划行为）：按计数采样代替时间节流，失败再密也能
        # 保证每 N 次留下一条、样本量可预期，不随现场节奏退化。
        # failure_log_first_n: 0 = 不逐条打；failure_log_every_n: 1 = 每次都打（排障），
        # 0 = 退回旧的 2 s 节流；failure_summary_every: 0 = 不打汇总。
        failure_log_first_n: 10
        failure_log_every_n: 25
        failure_summary_every: 50
        # 贴死兜底：正常路径 / 局部绕行 / 停车前缀都失败时，发一个不差于当前
        # 实测净空、末速为零的短前缀，把车挪出贴死状态。
        stuck_escape:
          enable: true
          # 安全段短于此值就不脱困（挪动太小没有意义）；实际可用长度 = 安全段 - buffer。
          min_length: 0.08
          # 收尾余量：前缀在第一个净空不足的采样点之前这么多米处结束。
          buffer: 0.05
        # 种子门只按"实际占据 / 地形不允许 / 查询失效"硬否决，折线净空不足交给 MINCO 优化，
        # 再由发布前整条轨迹 / 执行前指令门验收。机器人当前位置附近（弧长 collision_dist
        # 以内）只要求"不比当前实测净空更差"；离开该段后必须满足 collision_dist。
        replan_period_s: 0.2
        # 热启动时只把旧轨迹最近这一段作为新轨迹的初值前缀；过长会让旧路线
        # 拖住新规划，过短则重规划位置/速度容易跳变。0 表示不使用旧前缀。
        replan_continuity_time_s: 0.3
        # 轨迹总上限；普通路段由 region_control.normal_max_speed 限为 3.0，
        # 坡道可按 region_control.slope.max_speed 提到 4.0。
        max_velocity: 4.0
        max_acceleration: 5.0
        turn_angle_deadzone: 0.1
        turn_angle_saturation: 1.0
        min_turn_vel: 0.8
        decay_power: 1.3
        opt_accuracy: 0.001
        print_optimizer_log: false
        # 两次 MINCO（参考中科大 2025 技术报告 5.5.4.2）：PRE 先稳定轨迹形状，
        # FINELY 以 PRE 结果为初值并使用去掉沿轨迹方向分量的 ESDF 梯度。
        # 仍保留现有冷/热启动：状态连续性和旧轨迹前缀不由两次优化替代。
        two_stage_enable: true
        # PRE 阶段把各段时间约束在平均段时间的 ±ratio 附近，避免窄道前后
        # 控制点距离被拉大。weight=0 关闭该软约束。
        stage1_time_balance_weight: 10.0
        stage1_time_balance_ratio: 0.10
        # FINELY 阶段只保留位置梯度的法向分量，避免在窄隧道内沿轨迹方向
        # 把控制点推走；关闭后恢复单阶段的原始 ESDF 梯度。
        stage2_directional_gradient_enable: true
        # MINCO 时间正则 rho：cost += rho * ΣT，是轨迹速度的主要旋钮。100 为旧工程与 native
        # 最新提交共用的值；500 会把规划峰值推到约 2.51 m/s，底盘跟不上导致速度误差门反复重规划。
        penalty_weight_time: 100.0
        penalty_weight_pos: 50000.0
        penalty_weight_vel: 1500.0
        penalty_weight_acc: 1500.0
        penalty_weight_att: 100.0
        penalty_weight_time_barrier: 50.0
      recovery_server:
        fail_threshold: 5
        cooldown_sec: 1.0
        recovery_window_sec: 3.0
        escape_speed: 0.5
      performance:
        # 现场性能采样：逐次记录全局搜索、局部搜索、MINCO 优化及整轮重规划耗时。
        # 只写 CSV，不在控制循环打印；用于下一次 online 往返的瓶颈分析。
        enable: true
        print_enable: false
        detailed_csv_enable: true
        # 运行时在扩展名前加启动时间，保留每次导航的独立 CSV。
        minco_csv_path: "/home/mas/mas_nav_2027_native/.scratch/minco_perf_detailed.csv"
        odom_sub_debug_enable: false
      # B1: session-wide odom map accumulated from observed ROGMap types.
      # Local navigation still uses the live rolling map. Restart to change these settings.
      online_global_map:
        enabled: true
        resolution: 0.1
        update_rate_hz: 2.0
        max_cells: 2000000
        occupied_increment: 3
        free_decrement: 1
        evidence_limit: 5
        # New persistent obstacles need consecutive source observations;
        # pending cells are unknown/blocked. Live local safety stays immediate.
        occupied_confirmations: 2
        confirmation_max_gap_s: 1.5
        # 特殊地形需连续新快照确认；仅完整观测为普通地面的格子可连续纠错。
        terrain_confirmations: 3
        terrain_clear_confirmations: 10
      # 实时点云建图/障碍分类见 perception.yaml；地形识别见 terrain_recognition.yaml。
